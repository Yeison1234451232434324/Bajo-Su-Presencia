# ─────────────────────────────────────────────────────────────
#  Blueprint de Render — https://render.com/docs/blueprint-spec
#
#  Crea un único Web Service (Docker) con el sitio + el panel + la API.
#  Las variables marcadas «sync: false» NO se guardan aquí: se cargan a
#  mano en el panel de Render (Dashboard → el servicio → Environment).
# ─────────────────────────────────────────────────────────────
services:
  - type: web
    name: bajo-su-presencia
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # ── Entorno ────────────────────────────────────────────
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"

      # ── Supabase (Project Settings → API) — SECRETOS ───────
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

      # ── JWT propio de la app ──────────────────────────────
      - key: JWT_SECRET
        generateValue: true          # Render genera un secreto aleatorio
      - key: JWT_ISSUER
        value: bajo-su-presencia
      - key: JWT_TTL
        value: "300"

      # ── Fuerza bruta / recuperación ───────────────────────
      - key: MAX_LOGIN_ATTEMPTS
        value: "3"
      - key: LOCKOUT_MINUTES
        value: "15"
      - key: RESET_TOKEN_TTL
        value: "900"

      # ── CORS y URL pública ────────────────────────────────
      #  Con la API en el mismo origen casi no hace falta, pero
      #  se deja el dominio para el enlace del correo de reseteo.
      - key: CORS_ALLOWED_ORIGINS
        sync: false                  # p. ej. https://bajo-su-presencia.onrender.com
      - key: RESET_URL_BASE
        sync: false                  # https://<tu-dominio>/recuperar

      # ── Correo ────────────────────────────────────────────
      #  Producción: Brevo por API HTTP (los puertos SMTP están
      #  bloqueados en el plan free de Render). El remitente
      #  MAIL_USERNAME debe estar verificado en Brevo.
      - key: BREVO_API_KEY
        sync: false                  # xkeysib-...
      - key: MAIL_USERNAME
        sync: false                  # remitente verificado en Brevo
      - key: MAIL_FROM_NAME
        value: "Bajo Su Presencia"
      #  Respaldo SMTP (solo si NO hay BREVO_API_KEY; útil en local).
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_APP_PASSWORD
        sync: false
