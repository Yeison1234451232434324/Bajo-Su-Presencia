; Ajustes de producción propios del proyecto (se cargan al final).
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

memory_limit = 128M
max_execution_time = 30
post_max_size = 2M
upload_max_filesize = 2M

date.timezone = America/Bogota

; OPcache: la app no cambia en caliente dentro del contenedor.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.max_accelerated_files = 10000

; APCu también en CLI (no imprescindible, pero evita sorpresas en scripts).
apc.enable_cli = 1
