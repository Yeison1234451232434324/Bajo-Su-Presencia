# ─────────────────────────────────────────────────────────────
#  VirtualHost único: sitio + panel + API en el mismo origen.
#  El puerto lo fija el host mediante la variable de entorno PORT.
# ─────────────────────────────────────────────────────────────
<VirtualHost *:${PORT}>
    ServerName bajo-su-presencia
    DocumentRoot /var/www/html
    DirectoryIndex index.php

    # ── API PHP ──────────────────────────────────────────────
    #  /api/*  →  backend/public/index.php
    #  Se preserva REQUEST_URI (=/api/...) porque el Router del
    #  backend registra las rutas con el prefijo /api.
    Alias /api /var/www/html/backend/public
    <Directory /var/www/html/backend/public>
        AllowOverride None
        Require all granted
        Options -Indexes -MultiViews
        DirectoryIndex index.php

        RewriteEngine On
        RewriteBase /api
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>

    # ── Sitio público y panel ────────────────────────────────
    #  Todo lo demás pasa por el front controller raíz, que sirve
    #  vistas y activos desde su propia lista blanca.
    <Directory /var/www/html>
        AllowOverride None
        Require all granted
        Options -Indexes -MultiViews

        RewriteEngine On
        RewriteRule ^api(/|$) - [L]
        RewriteCond %{REQUEST_URI} !^/index\.php$
        RewriteRule ^ /index.php [L]
    </Directory>

    # ── Nunca servir código fuente, secretos ni documentación ─
    RedirectMatch 404 (?i)^/(backend|vendor|logs|deploy|sql|tests|\.git)(/|$)
    <FilesMatch "(?i)\.(env|sql|md|lock|ya?ml|ini|bak|old|log|dist|sh)$|^\.ht">
        Require all denied
    </FilesMatch>

    # ── Logs a la salida estándar (los recoge el panel del host) ─
    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
    LogLevel  warn
</VirtualHost>
