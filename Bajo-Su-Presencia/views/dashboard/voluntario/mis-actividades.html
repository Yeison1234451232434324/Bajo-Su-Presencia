<!--
  ================================================================
  MIS ACTIVIDADES ASIGNADAS — Panel del voluntario
  ================================================================
  Muestra al voluntario sus actividades asignadas agrupadas
  por evento. Puede marcar/desmarcar cada actividad como
  completada. Incluye barra de progreso global y por evento.
  Cuando todas están completas, la barra se pone verde.

  Archivos que usa:
    - panel.css                              → estilos base
    - mis-actividades.css                    → estilos específicos
    - sidebar.voluntario.controller.js       → sidebar del voluntario
    - eventos.model.js                       → info de eventos
    - voluntarios.model.js                   → info de eventos (fallback)
    - actividades.model.js                   → actividades asignadas
    - voluntario.actividades.controller.js   → lógica de la vista
  ================================================================
-->
<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Favicon oficial (logo de Bajo Su Presencia) — rutas absolutas: mismas en toda vista -->
  <link rel="icon" href="/Bajo-Su-Presencia/assets/images/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/Bajo-Su-Presencia/assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/Bajo-Su-Presencia/assets/images/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/Bajo-Su-Presencia/assets/images/apple-touch-icon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Actividades – Bajo Su Presencia B.S.P</title>
  <link rel="stylesheet" href="panel.css" />
  <link rel="stylesheet" href="mis-actividades.css" />
  <!-- Alertify Notifications CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/css/alertify.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/css/themes/default.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/alertify.min.js" integrity="sha384-3kOl9EzcOjFxTuc9knN784SI3NaWSFtoc4bHR9P8rsADaAZx9PC++m1OimQhoCCb" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <!-- Modo oscuro: tema + botón flotante (rutas absolutas, todas las vistas) -->
  <link rel="stylesheet" href="/Bajo-Su-Presencia/helpers/theme.css">
  <script src="/Bajo-Su-Presencia/helpers/theme.js"></script>
</head>
<body>

<main class="main" id="main">
  <section class="panel active" style="display:block;">

    <!-- ── Encabezado con ícono + progreso total ─────────────────────── -->
    <div class="mact-header-row">
      <div class="mact-header-left">
        <div class="mact-header-icon">
          <i class="bx bx-list-check" aria-hidden="true"></i>
        </div>
        <div class="mact-header-text">
          <h2>Mis Actividades Asignadas</h2>
          <p>Tareas asignadas en los eventos donde confirmaste disponibilidad</p>
        </div>
      </div>
      <div class="mact-progreso-total">
        <div class="mact-progreso-label">Progreso total</div>
        <div class="mact-progreso-num" id="mact-progreso-num">0/0</div>
      </div>
    </div>

    <!-- ── Barra de progreso global ──────────────────────────────────── -->
    <div class="mact-barra-wrap">
      <div class="mact-barra-label">
        <span>Actividades completadas</span>
        <span id="mact-barra-pct">0%</span>
      </div>
      <div class="mact-barra-track">
        <div class="mact-barra-fill" id="mact-barra-fill" style="width:0%"></div>
      </div>
    </div>

    <!-- ── Contenedor de secciones por evento ────────────────────────── -->
    <div id="mact-contenedor">
      <!-- Secciones generadas por el controller -->
    </div>

  </section>
</main>

<!-- ══ SCRIPTS ══════════════════════════════════════════════════════════ -->
  <script src="../../../helpers/validators.helper.js"></script>
  <script src="../../../controllers/sidebar.voluntario.controller.js"></script>
<!-- Supabase: SDK + cliente (ANTES de los modelos) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8" integrity="sha384-Tve8O+C6PBzsIMK/IRCwHbi8fyEzXIlIs6OfVBZHubplwYhaQF/4Mzxqgg+pp/oy" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="../../../services/supabase.client.js"></script>
<script src="../../../config/api.config.js"></script>
<!-- Control de acceso verificado contra el servidor (debe ir tras api.config.js) -->
<script src="../../../core/session.manager.js"></script>
<script src="../../../services/db.client.js"></script>
<script src="../../../models/eventos.model.js"></script>
<script src="../../../models/actividades.model.js"></script>
<!-- Alertify Helper -->
<script src="../../../helpers/alertify.helper.js"></script>
  <script src="../../../controllers/voluntario.actividades.controller.js"></script>

  <script src="../../../controllers/ayuda.controller.js"></script>
</body>
</html>
