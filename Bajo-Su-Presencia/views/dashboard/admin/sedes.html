<!--
  ================================================================
  GESTIÓN DE SEDES — Solo Administrador
  ================================================================
  Permite al admin ver, agregar y eliminar sedes de la iglesia.
  Sin botón "Seleccionar Sede".

  Archivos que usa:
    - panel.css             → estilos base
    - sedes.css             → estilos específicos
    - sidebar.controller.js → sidebar del admin
    - sedes.model.js        → CRUD de sedes
    - sedes.controller.js   → lógica completa
  ================================================================
-->
<!DOCTYPE html>
<html lang="es">
<head>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
  <!-- Favicon oficial (logo de Bajo Su Presencia) — rutas absolutas: mismas en toda vista -->
  <link rel="icon" href="/Bajo-Su-Presencia/assets/images/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/Bajo-Su-Presencia/assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/Bajo-Su-Presencia/assets/images/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/Bajo-Su-Presencia/assets/images/apple-touch-icon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Sedes – Bajo Su Presencia B.S.P</title>
  <link rel="stylesheet" href="panel.css" />
  <link rel="stylesheet" href="sedes.css" />
  <!-- Alertify Notifications CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/css/alertify.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/css/themes/default.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/alertify.min.js" integrity="sha384-3kOl9EzcOjFxTuc9knN784SI3NaWSFtoc4bHR9P8rsADaAZx9PC++m1OimQhoCCb" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <!-- Modo oscuro: tema + botón flotante (rutas absolutas, todas las vistas) -->
  <link rel="stylesheet" href="/Bajo-Su-Presencia/helpers/theme.css">
  <script src="/Bajo-Su-Presencia/helpers/theme.js"></script>
</head>
<body>

<main class="main" id="main">
  <section class="panel active">

    <!-- ── Barra superior: encabezado + botón Agregar Sede ─────────────── -->
    <div class="sed-topbar">
      <div class="sed-header-left">
        <div class="sed-header-icon"><i class="bx bx-buildings" aria-hidden="true"></i></div>
        <div class="sed-header-text">
          <h2>Gestión de Múltiples Sedes</h2>
          <p>Administre contenido para diferentes ubicaciones</p>
        </div>
      </div>
      <button class="sed-btn-agregar">
        <i class="bx bx-plus" aria-hidden="true"></i> Agregar Sede
      </button>
    </div>

    <!-- Guía de sección -->
    <div class="guia-seccion">
      <p class="guia-seccion-label"><i class="bx bx-info-circle" aria-hidden="true"></i> Guía de sección</p>
      <p class="guia-seccion-texto">Gestiona las sedes y sucursales de la iglesia. Agrega nuevas sedes con su dirección, teléfono y encargado. Esta información está disponible para toda la organización.</p>
    </div>

    <!-- DataTable de sedes -->
    <div id="dt-sedes"></div>

  </section>
</main>

<!-- ══ OVERLAY ══════════════════════════════════════════════════════════ -->
<div class="sed-modal-overlay" id="sed-modal-overlay"></div>

<!-- ══ MODAL: NUEVA SEDE ════════════════════════════════════════════════ -->
<div class="sed-modal" id="sed-modal" role="dialog" aria-modal="true" aria-labelledby="sed-modal-titulo">
  <div class="sed-modal-box">

    <div class="sed-modal-titulo" id="sed-modal-titulo">Nueva Sede</div>

    <form id="form-sede" novalidate>

      <!-- Fila 1: Nombre + Ciudad -->
      <div class="sed-form-row">
        <div class="sed-field">
          <label for="sed-nombre">Nombre de la Sede *</label>
          <input type="text" id="sed-nombre" class="sed-input"
            placeholder="Ej: Sede Norte - Suba" required />
        </div>
        <div class="sed-field">
          <label for="sed-ciudad">Ciudad *</label>
          <input type="text" id="sed-ciudad" class="sed-input"
            placeholder="Ej: Bogotá" required />
        </div>
      </div>

      <!-- Fila 2: Dirección + Teléfono -->
      <div class="sed-form-row">
        <div class="sed-field">
          <label for="sed-direccion">Dirección *</label>
          <input type="text" id="sed-direccion" class="sed-input"
            placeholder="Ej: Calle 45 #12-34" required />
        </div>
        <div class="sed-field">
          <label for="sed-telefono">Teléfono</label>
          <input type="text" id="sed-telefono" class="sed-input"
            inputmode="numeric" maxlength="10" pattern="\d{10}"
            title="Exactamente 10 dígitos numéricos"
            placeholder="Ej: 6012345678" />
        </div>
      </div>

      <!-- Fila 3: Pastor + Miembros -->
      <div class="sed-form-row">
        <div class="sed-field">
          <label for="sed-pastor">Pastor/a Responsable</label>
          <input type="text" id="sed-pastor" class="sed-input"
            placeholder="Ej: Pastor Juan García" />
        </div>
        <div class="sed-field">
          <label for="sed-miembros">Número de Miembros</label>
          <input type="number" id="sed-miembros" class="sed-input"
            placeholder="Ej: 150" min="0" />
        </div>
      </div>

      <!-- Botones -->
      <div class="sed-modal-footer">
        <button type="submit" class="sed-btn-guardar">Agregar Sede</button>
        <button type="button" class="sed-btn-cancelar">Cancelar</button>
      </div>

    </form>
  </div>
</div>

<!-- ══ SCRIPTS ══════════════════════════════════════════════════════════ -->
  <script src="../../../helpers/validators.helper.js"></script>
  <script src="../../../helpers/modal.helper.js"></script>
  <script src="../../../controllers/sidebar.controller.js"></script>
<!-- Supabase: SDK + cliente compartido (ANTES del modelo, que usa window.sb) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8" integrity="sha384-Tve8O+C6PBzsIMK/IRCwHbi8fyEzXIlIs6OfVBZHubplwYhaQF/4Mzxqgg+pp/oy" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="../../../services/supabase.client.js"></script>
<script src="../../../config/api.config.js"></script>
<!-- Control de acceso verificado contra el servidor (debe ir tras api.config.js) -->
<script src="../../../core/session.manager.js"></script>
<script src="../../../services/db.client.js"></script>
<script src="../../../models/sedes.model.js"></script>
<!-- Motor DataTable -->
<script src="../../../helpers/datatable.helper.js"></script>
<!-- Alertify Helper -->
<link rel="stylesheet" href="../../../helpers/alertify.overrides.css" />
<script src="../../../helpers/alertify.helper.js"></script>
  <script src="../../../controllers/sedes.controller.js"></script>

  <script src="../../../controllers/ayuda.controller.js"></script>
</body>
</html>
