<!--
  ================================================================
  LOGIN — Inicio de sesión del sistema
  ================================================================
  ¿Qué hace esta página?
  Permite a los usuarios (admin, colaborador, voluntario) iniciar
  sesión en el panel de administración con sus credenciales.

  Secciones:
    1. Botón de cierre → regresa a la página pública (index.html)
    2. Formulario: nombre de usuario, correo electrónico y contraseña
    3. Opción "Recordar" y enlace a recuperar contraseña
    4. Mensaje de error (oculto por defecto, visible si falla el login)

  Archivos que usa:
    - login.css              → estilos del formulario de login
    - auth.controller.js     → valida credenciales y redirige según rol
    - Boxicons (CDN)         → íconos de usuario, correo y candado
    - Google Fonts (EB Garamond) → tipografía del formulario
  ================================================================
-->
<!DOCTYPE html>
<html lang="en">

<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://unpkg.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
  <!-- Favicon oficial (logo de Bajo Su Presencia) — rutas absolutas: mismas en toda vista -->
  <link rel="icon" href="/Bajo-Su-Presencia/assets/images/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/Bajo-Su-Presencia/assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/Bajo-Su-Presencia/assets/images/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/Bajo-Su-Presencia/assets/images/apple-touch-icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <title>Login</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/css/alertify.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/css/themes/default.min.css" />
    <link rel="stylesheet" href="login.css">
  <!-- Modo oscuro: tema + botón flotante (rutas absolutas, todas las vistas) -->
  <link rel="stylesheet" href="/Bajo-Su-Presencia/helpers/theme.css">
  <script src="/Bajo-Su-Presencia/helpers/theme.js"></script>
</head>

<body>
    <div class="container">
        <a href="../../public/inicio/index.html" class="btn-cerrar">
            <i class='bx bx-x'></i>
        </a>
        <form id="loginForm">
            <h1>Login</h1>

            <!-- Las etiquetas se ocultan visualmente (clase .sr-only) para no
                 alterar el diseño, pero SÍ las anuncian los lectores de pantalla.
                 Un `placeholder` no es un nombre accesible y además desaparece
                 al escribir (WCAG 4.1.2 y 3.3.2, nivel A). -->
            <div class="input-box">
                <label for="username" class="sr-only">Nombre de usuario</label>
                <input type="text" id="username" name="username" autocomplete="username"
                       placeholder="Nombre de Usuario" required>
                <i class='bx bxs-user' aria-hidden="true"></i>
            </div>
            <div class="input-box">
                <label for="email" class="sr-only">Correo electrónico</label>
                <input type="email" id="email" name="email" autocomplete="email"
                       placeholder="Correo electrónico" required>
                <i class='bx bxs-envelope' aria-hidden="true"></i>
            </div>
            <div class="input-box">
                <label for="password" class="sr-only">Contraseña</label>
                <input type="password" id="password" name="password" autocomplete="current-password"
                       placeholder="Contraseña" required>
                <i class='bx bxs-lock-alt' id="icon-lock" aria-hidden="true"></i>
                <button type="button" class="toggle-password" id="toggle-password" aria-label="Mostrar/ocultar contraseña">
                    <i class='bx bx-hide' id="eye-icon"></i>
                </button>
            </div>
            <div class="recordar-contraseña">
                <!-- El atributo for="" estaba vacío (HTML inválido) y el campo
                     carecía de id y name. Se corrige la asociación explícita. -->
                <label for="recordar">
                    <input type="checkbox" id="recordar" name="recordar">Recordar
                </label>
                <a href="recuperar.html">Recuperar contraseña</a>
            </div>
            <button type="submit" class="boton">Iniciar Sesión</button>
            <!-- Mensaje de error manejado por alertify -->
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/alertify.min.js" integrity="sha384-3kOl9EzcOjFxTuc9knN784SI3NaWSFtoc4bHR9P8rsADaAZx9PC++m1OimQhoCCb" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="../../../helpers/alertify.helper.js?v=6"></script>
    <!-- SDK de Supabase + cliente compartido (deben ir ANTES de auth.controller.js) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8" integrity="sha384-Tve8O+C6PBzsIMK/IRCwHbi8fyEzXIlIs6OfVBZHubplwYhaQF/4Mzxqgg+pp/oy" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="../../../services/supabase.client.js?v=6"></script>
    <script src="../../../config/api.config.js?v=6"></script>
    <script src="../../../controllers/auth.controller.js?v=6"></script>
    <script>
        // Toggle mostrar/ocultar contraseña
        document.getElementById('toggle-password').addEventListener('click', function() {
            const input   = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            if (input.type === 'password') {
                input.type = 'text';
                eyeIcon.className = 'bx bx-show';
            } else {
                input.type = 'password';
                eyeIcon.className = 'bx bx-hide';
            }
        });
    </script>
</body>

</html>
