<!--
  ================================================================
  CENTRO DE AYUDA — Bajo Su Presencia
  ================================================================
  Página generada dinámicamente desde el array KB_DATA.
  El contenido se filtra automáticamente según el rol del usuario
  logueado en localStorage ('usuarioLogueado').

  Archivos que usa:
    - ayuda.css              → estilos del layout
    - Boxicons CDN           → íconos
    - ayuda.controller.js   → widget flotante (inyectado al final)
  ================================================================
-->
<!DOCTYPE html>
<html lang="es">
<head>
<link rel="preconnect" href="https://unpkg.com">
  <!-- Favicon oficial (logo de Bajo Su Presencia) — rutas absolutas: mismas en toda vista -->
  <link rel="icon" href="/Bajo-Su-Presencia/assets/images/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/Bajo-Su-Presencia/assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/Bajo-Su-Presencia/assets/images/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/Bajo-Su-Presencia/assets/images/apple-touch-icon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Centro de Ayuda – Bajo Su Presencia B.S.P</title>
  <meta name="description" content="Encuentra respuestas sobre el sistema Bajo Su Presencia." />
  <link rel="stylesheet" href="ayuda.css" />
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" />
  <!-- Modo oscuro: tema + botón flotante (rutas absolutas, todas las vistas) -->
  <link rel="stylesheet" href="/Bajo-Su-Presencia/helpers/theme.css">
  <script src="/Bajo-Su-Presencia/helpers/theme.js"></script>
</head>
<body>

<!-- Las secciones se generan por JS después del DOMContentLoaded -->
<div id="ac-app"></div>

<script src="../../controllers/ayuda-page.controller.js?v=1"></script>

<!-- Widget flotante (mismo rol que el resto del panel) -->
<script src="../../controllers/ayuda.controller.js"></script>

</body>
</html>
