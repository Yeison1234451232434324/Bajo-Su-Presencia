<!--
  ================================================================
  LOGIN — Inicio de sesión del sistema
  ================================================================
  ¿Qué hace esta página?
  Permite a los usuarios (admin, colaborador, voluntario) iniciar
  sesión en el panel de administración con sus credenciales.

  Secciones:
    1. Botón de cierre → regresa a la página pública (index.html)
    2. Formulario: nombre de usuario, correo electrónico y contraseña
    3. Opción "Recordar" y enlace a recuperar contraseña
    4. Mensaje de error (oculto por defecto, visible si falla el login)

  Archivos que usa:
    - login.css              → estilos del formulario de login
    - auth.controller.js     → valida credenciales y redirige según rol
    - Boxicons (CDN)         → íconos de usuario, correo y candado
    - Google Fonts (Poppins) → tipografía del formulario
  ================================================================
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/css/alertify.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/css/themes/default.min.css" />
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="container">
        <a href="../../public/inicio/index.html" class="btn-cerrar">
            <i class='bx bx-x'></i>
        </a>
        <form id="loginForm">
            <h1>Login</h1>

            <div class="input-box">
                <input type="text" id="username" placeholder="Nombre de Usuario" required>
                <i class='bx bxs-user'></i>
            </div>
            <div class="input-box">
                <input type="email" id="email" placeholder="Correo electrónico" required>
                <i class='bx bxs-envelope'></i>
            </div>
            <div class="input-box">
                <input type="password" id="password" placeholder="Contraseña" required>
                <i class='bx bxs-lock-alt' id="icon-lock"></i>
                <button type="button" class="toggle-password" id="toggle-password" aria-label="Mostrar/ocultar contraseña">
                    <i class='bx bx-hide' id="eye-icon"></i>
                </button>
            </div>
            <div class="recordar-contraseña">
                <label for=""><input type="checkbox">Recordar</label>
                <a href="recuperar.html">Recuperar contraseña</a>
            </div>
            <button type="submit" class="boton">Iniciar Sesión</button>
            <!-- Mensaje de error manejado por alertify -->
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/alertify.min.js"></script>
    <script src="../../../controllers/alertify.helper.js"></script>
    <script src="../../../controllers/auth.controller.js"></script>
    <script>
        // Toggle mostrar/ocultar contraseña
        document.getElementById('toggle-password').addEventListener('click', function() {
            const input   = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            if (input.type === 'password') {
                input.type = 'text';
                eyeIcon.className = 'bx bx-show';
            } else {
                input.type = 'password';
                eyeIcon.className = 'bx bx-hide';
            }
        });
    </script>
</body>

</html>
