<!--
  ================================================================
  RECUPERAR CONTRASEÑA — Restablecimiento de acceso
  ================================================================
  ¿Qué hace esta página?
  Permite al usuario solicitar el restablecimiento de su contraseña
  ingresando su correo electrónico registrado.

  Secciones:
    1. Botón de regreso → vuelve a login.html
    2. Formulario: campo de correo electrónico
    3. Mensaje de éxito (oculto por defecto): confirma el envío
       y redirige automáticamente al login tras 4 segundos

  Nota: el envío es simulado (no hay backend real).
  La redirección se hace con setTimeout en el script inline.

  Archivos que usa:
    - login.css      → estilos base reutilizados del login
    - recuperar.css  → ajustes específicos de esta pantalla
    - Boxicons (CDN) → ícono de correo y flecha de regreso
    - Google Fonts (Poppins) → tipografía del formulario
  ================================================================
-->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/css/alertify.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/css/themes/default.min.css" />
    <!-- Reutilizamos el diseño del login -->
    <link rel="stylesheet" href="login.css">
    <!-- Archivo CSS específico para ajustes de recuperar contraseña -->
    <link rel="stylesheet" href="recuperar.css">
</head>
<body>
    <div class="container recuperar-container">
        <!-- Botón para regresar al login -->
        <a href="login.html" class="btn-cerrar" title="Volver al Login">
            <i class='bx bx-arrow-back'></i>
        </a>
        
        <form id="recuperarForm">
            <h1>Recuperar Contraseña</h1>
            
            <p class="recuperar-texto">
                Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.
            </p>

            <div class="input-box">
                <input type="email" id="email" placeholder="Correo electrónico" required>
                <i class='bx bxs-envelope'></i>
            </div>
            
            <button type="submit" class="boton">Enviar enlace</button>
            
            <!-- Mensaje de éxito manejado por alertify -->
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/alertify.min.js"></script>
    <script src="../../../controllers/alertify.helper.js"></script>
    <script>
        document.getElementById('recuperarForm').addEventListener('submit', function(e) {
            e.preventDefault();
            showAlertSuccess('Si el correo está registrado, recibirás las instrucciones en breve. Serás redirigido al login...');
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 4000);
        });
    </script>
</body>
</html>
